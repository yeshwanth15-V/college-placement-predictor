<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Compare your profile with company requirements and get improvement suggestions — MCET Placement Predictor">
    <title>Profile Comparison — MCET Placement Predictor</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
</head>

<body>

    <div class="comparison-page">

        <!-- Header -->
        <div class="comparison-header">
            <div class="container">
                <div class="flex-between" style="margin-bottom:var(--space-lg);">
                    <div></div>
                    <button class="btn btn-outline btn-sm" onclick="handleLogout()">🚪 Logout</button>
                </div>
                <h1 id="comparisonTitle">Profile vs Company Requirements</h1>
                <p id="comparisonSubtitle">Detailed comparison of your profile</p>
            </div>
        </div>

        <!-- Content -->
        <div class="comparison-content">

            <!-- Comparison Table -->
            <div class="comparison-table-card" id="comparisonTableCard">
                <table class="comparison-table">
                    <thead>
                        <tr>
                            <th>Criteria</th>
                            <th>Company Requires</th>
                            <th>Your Profile</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="comparisonTableBody">
                        <!-- Filled dynamically -->
                    </tbody>
                </table>
            </div>

            <!-- Skills Comparison -->
            <div class="card" id="skillsComparisonCard">
                <h3
                    style="color:var(--gray-900); margin-bottom:var(--space-lg); display:flex; align-items:center; gap:8px;">
                    <span style="font-size:1.2rem;">🛠️</span> Skills Comparison
                </h3>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:var(--space-xl);"
                    id="skillsComparisonGrid">
                    <!-- Filled dynamically -->
                </div>
            </div>

            <!-- Improvement Suggestions -->
            <div class="suggestions-section" id="suggestionsSection">
                <h2>
                    <span>💡</span> Skill Improvement Suggestions
                </h2>
                <div class="suggestions-grid" id="suggestionsGrid">
                    <!-- Filled dynamically -->
                </div>
            </div>

            <!-- Actions -->
            <div class="comparison-actions">
                <button class="btn btn-primary btn-lg" onclick="window.location.href='company-select.html'">
                    🔄 Try Another Company
                </button>
                <button class="btn btn-gold btn-lg" onclick="window.location.href='student-profile.html'"
                    style="margin-left:var(--space-md);">
                    ✏️ Update My Profile
                </button>
            </div>

        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="js/app.js"></script>
    <script src="js/companies.js"></script>
    <script src="js/eligibility.js"></script>
    <script src="js/comparison.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!requireAuth('student')) return;

            const result = Session.get('eligibilityResult');
            if (!result) {
                showToast('No eligibility data. Please check a company first.', 'warning');
                setTimeout(() => { window.location.href = 'company-select.html'; }, 1500);
                return;
            }

            renderComparison(result);
        });
    </script>
</body>

</html>
