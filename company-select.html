<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Select a visiting company and check your placement eligibility — MCET Placement Predictor">
    <title>Select Company — MCET Placement Predictor</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
</head>

<body>

    <div class="student-page">

        <!-- Navbar -->
        <nav class="student-navbar">
            <div class="nav-brand">
                <div class="brand-dot">M</div>
                <div>
                    <h3>Placement Predictor</h3>
                    <span>MCET</span>
                </div>
            </div>
            <div class="nav-actions">
                <span id="studentRollDisplay" style="font-size:0.85rem; color:var(--gray-500);">Student</span>
                <button class="btn btn-sm btn-outline" style="color:var(--gray-600); border-color:var(--gray-300);"
                    onclick="handleLogout()">Logout</button>
            </div>
        </nav>

        <!-- Step Indicator -->
        <div class="step-indicator">
            <div class="step completed">
                <div class="step-circle">✓</div>
                <div class="step-label">Upload Resume</div>
                <div class="step-line active"></div>
            </div>
            <div class="step completed">
                <div class="step-circle">✓</div>
                <div class="step-label">View Profile</div>
                <div class="step-line active"></div>
            </div>
            <div class="step active">
                <div class="step-circle">3</div>
                <div class="step-label">Select Company</div>
                <div class="step-line"></div>
            </div>
            <div class="step">
                <div class="step-circle">4</div>
                <div class="step-label">Results</div>
            </div>
        </div>

        <!-- Page Content -->
        <div class="page-content" style="max-width:1000px;">
            <div class="text-center mb-xl">
                <h1 style="font-size:1.75rem; color:var(--gray-900);">Companies Visiting Campus</h1>
                <p style="color:var(--gray-500); max-width:550px; margin:8px auto 0;">
                    Select a company below to check your placement eligibility against their requirements.
                </p>
            </div>

            <!-- Company Grid -->
            <div class="company-grid" id="companyGrid">
                <!-- Filled dynamically -->
            </div>

            <!-- Check Eligibility Button -->
            <div class="profile-actions" id="eligibilityActions" style="display:none;">
                <button class="btn btn-gold btn-lg" onclick="checkEligibility()" id="checkEligibilityBtn"
                    style="font-size:1.1rem; padding:18px 48px;">
                    🎯 Check Eligibility →
                </button>
                <p style="color:var(--gray-400); font-size:0.85rem; margin-top: var(--space-md);"
                    id="selectedCompanyLabel">
                    Select a company above
                </p>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="js/app.js"></script>
    <script src="js/companies.js"></script>
    <script>
        let selectedCompanyId = null;

        document.addEventListener('DOMContentLoaded', () => {
            if (!requireAuth('student')) return;

            const studentUser = Session.get('studentUser');
            if (studentUser) {
                document.getElementById('studentRollDisplay').textContent = studentUser.roll;
            }

            const profile = Session.get('studentProfile');
            if (!profile) {
                showToast('Please upload your resume first', 'warning');
                setTimeout(() => { window.location.href = 'student-upload.html'; }, 1500);
                return;
            }

            renderCompanies();
        });

        function renderCompanies() {
            const companies = getCompanies();
            const grid = document.getElementById('companyGrid');
            grid.innerHTML = '';

            companies.forEach(company => {
                const card = document.createElement('div');
                card.className = 'company-card';
                card.id = `company-${company.id}`;
                card.onclick = () => selectCompany(company.id);

                card.innerHTML = `
          <div class="check-icon">✓</div>
          <div class="company-logo" style="background:${company.color}18; color:${company.color};">
            ${company.logo}
          </div>
          <h3>${company.name}</h3>
          <div class="company-type">${company.type} · ${company.package}</div>
          <div class="criteria-preview">
            <span class="badge badge-gold">CGPA ≥ ${company.criteria.minCGPA}</span>
            <span class="badge badge-info">${company.criteria.skills.length} Skills</span>
            <span class="badge ${company.criteria.internshipRequired ? 'badge-success' : 'badge-warning'}">
              ${company.criteria.internshipRequired ? 'Internship Req.' : 'No Intern Req.'}
            </span>
          </div>
        `;

                grid.appendChild(card);
            });
        }

        function selectCompany(companyId) {
            // Deselect all
            document.querySelectorAll('.company-card').forEach(c => c.classList.remove('selected'));

            // Select this one
            const card = document.getElementById(`company-${companyId}`);
            card.classList.add('selected');
            selectedCompanyId = companyId;

            const company = getCompanyById(companyId);
            document.getElementById('selectedCompanyLabel').textContent = `Selected: ${company.name} — ${company.fullName}`;
            document.getElementById('eligibilityActions').style.display = 'block';
        }

        function checkEligibility() {
            if (!selectedCompanyId) {
                showToast('Please select a company first', 'warning');
                return;
            }

            Session.set('selectedCompanyId', selectedCompanyId);
            window.location.href = 'eligibility.html';
        }
    </script>
</body>

</html>
